<a class="reading-link" href="{{ include.post.url | relative_url }}">
  <div class="reading-meta">{{ include.post.content_type | escape }}{% if include.show_topic %}<span aria-hidden="true"> · </span>{{ include.post.categories | first | escape }}{% endif %}</div>
  <h3>{{ include.post.reading_title | default: include.post.title | escape }}</h3>
  {% if include.summary %}<p>{{ include.post.description | escape }}</p>{% endif %}
</a>
