<div class="category-posts" data-page-size="10">
  <ul class="content ps-0">
    {% for post in include.posts %}
      <li class="d-flex justify-content-between px-md-3" data-category-post>
        <a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
        <span class="dash flex-grow-1"></span>
        <time class="text-muted small text-nowrap" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y/%m/%d' }}</time>
      </li>
    {% endfor %}
  </ul>
</div>
