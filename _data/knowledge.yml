  - id: agent-harness
    topic: ai
    title: Agent 工程与安全
    description: 执行环境、工具、记忆、编排、评估与治理的完整阅读路径。
    match: 'Agent|agent|Harness|harness|Parallax|Anthropic|anthropic|Hermes|hermes|Qwen|qwen|langchain|LangGraph|Model-Neutrality|model-neutrality|关于agent'
    route:
      - url: /knowledge/AI-Infra-Agent基础设施体系综述/
